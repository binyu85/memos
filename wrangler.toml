name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "0a8d3cff-bde8-408b-9ec2-aa12bf954b3c"
database_name = "YOUR_D1_DATABASE_NAME"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "c2c23db7d015427e8ff236a6f054a30f"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
